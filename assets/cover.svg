<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Function Density Atlas">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="120%">
      <stop offset="0%" stop-color="#0c0c0e"/>
      <stop offset="55%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="g-amber"><stop offset="0%" stop-color="#fff" stop-opacity="1"/><stop offset="22%" stop-color="#F5A623" stop-opacity=".9"/><stop offset="100%" stop-color="#F5A623" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-pink"><stop offset="0%" stop-color="#fff" stop-opacity="1"/><stop offset="22%" stop-color="#FF2D9B" stop-opacity=".9"/><stop offset="100%" stop-color="#FF2D9B" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-scarlet"><stop offset="0%" stop-color="#fff" stop-opacity="1"/><stop offset="22%" stop-color="#E2231A" stop-opacity=".9"/><stop offset="100%" stop-color="#E2231A" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-lime"><stop offset="0%" stop-color="#fff" stop-opacity="1"/><stop offset="22%" stop-color="#7ED321" stop-opacity=".9"/><stop offset="100%" stop-color="#7ED321" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-cyan"><stop offset="0%" stop-color="#fff" stop-opacity="1"/><stop offset="22%" stop-color="#2EE6C8" stop-opacity=".9"/><stop offset="100%" stop-color="#2EE6C8" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-violet"><stop offset="0%" stop-color="#fff" stop-opacity="1"/><stop offset="22%" stop-color="#B26BFF" stop-opacity=".9"/><stop offset="100%" stop-color="#B26BFF" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- faint graph-paper grid -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 105 H1200 M0 210 H1200 M0 315 H1200"/>
    <path d="M150 0 V420 M300 0 V420 M450 0 V420 M600 0 V420 M750 0 V420 M900 0 V420 M1050 0 V420"/>
  </g>

  <!-- glowing density clusters (each a revolved-function field) -->
  <g style="mix-blend-mode:screen">
    <circle cx="210" cy="150" r="120" fill="url(#g-amber)"/>
    <circle cx="430" cy="250" r="140" fill="url(#g-pink)"/>
    <circle cx="640" cy="140" r="110" fill="url(#g-scarlet)"/>
    <circle cx="830" cy="260" r="130" fill="url(#g-lime)"/>
    <circle cx="1000" cy="150" r="120" fill="url(#g-cyan)"/>
    <circle cx="560" cy="320" r="90" fill="url(#g-violet)"/>
  </g>
  <!-- hot cores + signal-yellow quantity dots -->
  <g fill="#ffffff">
    <circle cx="210" cy="150" r="3.2"/><circle cx="430" cy="250" r="3.2"/><circle cx="640" cy="140" r="3.2"/>
    <circle cx="830" cy="260" r="3.2"/><circle cx="1000" cy="150" r="3.2"/><circle cx="560" cy="320" r="2.6"/>
  </g>
  <g fill="#F8E71C">
    <circle cx="300" cy="120" r="2.4"/><circle cx="510" cy="200" r="2.4"/><circle cx="720" cy="180" r="2.4"/><circle cx="920" cy="220" r="2.4"/>
  </g>

  <!-- title -->
  <text x="60" y="370" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="6" fill="#ffffff">FUNCTION DENSITY ATLAS</text>
  <text x="62" y="395" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#7c8294">TWELVE SOLIDS OF REVOLUTION · LUMINOUS GLASS FIELD</text>
</svg>
